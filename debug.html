<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:16px monospace;margin:0;padding:12px;background:#fff}</style></head><body>
<div id="out">measuring…</div>
<script>
const f = document.createElement('iframe');
f.src = 'index.html';
f.style.cssText = 'width:375px;height:2600px;border:0;position:absolute;left:-9999px';
document.body.appendChild(f);
f.onload = () => setTimeout(() => {
  const d = f.contentDocument;
  const lines = ['innerWidth: ' + f.contentWindow.innerWidth,
                 'scrollWidth: ' + d.documentElement.scrollWidth];
  const over = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.right > 376.5) over.push(`${el.tagName.toLowerCase()}.${el.className||'-'} right=${Math.round(r.right)} w=${Math.round(r.width)}`);
  });
  lines.push('--- overflowing (' + over.length + ') ---', ...over.slice(0, 25));
  document.getElementById('out').innerHTML = lines.map(l => `<div>${l.replace(/</g,'&lt;')}</div>`).join('');
}, 1200);
</script></body></html>
